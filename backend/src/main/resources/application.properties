spring.application.name=mintrack-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mining_db
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080
server.servlet.context-path=/api

# CORS (pour le frontend React et l'app mobile)
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:19006

# JWT
jwt.secret=mintrack-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# Logs debug security
logging.level.com.mintrack.security=DEBUG
logging.level.org.springframework.security=DEBUG
