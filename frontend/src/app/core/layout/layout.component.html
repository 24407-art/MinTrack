<div class="layout" [class.sidebar-closed]="!sidebarOpen">
  <aside class="sidebar">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22h20"/><path d="M6.36 18.4 4 22"/><path d="m19.64 18.4 2.36 3.6"/><path d="M12 2v8"/><path d="m5 10 7-7 7 7"/><circle cx="12" cy="15" r="2"/><path d="M4 22h-2v-5.5a.5.5 0 0 1 .5-.5.5.5 0 0 0 .5-.5 2 2 0 0 1 2-2"/><path d="M22 22h-2v-5.5a.5.5 0 0 0-.5-.5.5.5 0 0 1-.5-.5 2 2 0 0 0-2-2"/></svg>
        </div>
        <div *ngIf="sidebarOpen" class="logo-text">
          <span class="logo-title">MinTrack</span>
          <span class="logo-subtitle">Gestion des Mines</span>
        </div>
      </div>
      <div class="logo-divider"></div>
    </div>

    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </span>
        <span *ngIf="sidebarOpen" class="nav-label">Tableau de bord</span>
        <span class="nav-indicator"></span>
      </a>
      <a routerLink="/sites" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        </span>
        <span *ngIf="sidebarOpen" class="nav-label">Sites</span>
        <span class="nav-indicator"></span>
      </a>
      <a routerLink="/personnel" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <span *ngIf="sidebarOpen" class="nav-label">Personnel</span>
        <span class="nav-indicator"></span>
      </a>
      <a routerLink="/teams" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a3 3 0 0 0-3-3H9a3 3 0 0 0-3 3"/><circle cx="12" cy="7" r="4"/><path d="M22 21a3 3 0 0 0-3-3h-1.5"/></svg>
        </span>
        <span *ngIf="sidebarOpen" class="nav-label">Equipes</span>
        <span class="nav-indicator"></span>
      </a>
      <a routerLink="/shifts" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        <span *ngIf="sidebarOpen" class="nav-label">Shifts</span>
        <span class="nav-indicator"></span>
      </a>
      <a routerLink="/equipment" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </span>
        <span *ngIf="sidebarOpen" class="nav-label">Equipements</span>
        <span class="nav-indicator"></span>
      </a>
      <a routerLink="/production" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        </span>
        <span *ngIf="sidebarOpen" class="nav-label">Production</span>
        <span class="nav-indicator"></span>
      </a>
      <a routerLink="/reports" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
        </span>
        <span *ngIf="sidebarOpen" class="nav-label">Rapports</span>
        <span class="nav-indicator"></span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user" *ngIf="sidebarOpen && (user$ | async) as user">
        <div class="user-avatar">{{ user.username.charAt(0).toUpperCase() }}</div>
        <span class="user-name">{{ user.username }}</span>
      </div>
      <button class="logout-btn" (click)="logout()" [title]="sidebarOpen ? 'Déconnexion' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <!-- Ligne jaune décorative -->
      <div class="header-top-line"></div>

      <div class="header-left">
        <!-- Toggle sidebar -->
        <button class="header-btn toggle-btn" (click)="toggleSidebar()" title="Basculer le menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
        </button>

        <!-- Titre de page avec icône shimmer -->
        <div class="page-title">
          <div class="title-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <h1 class="title-text">MinTrack</h1>
        </div>
      </div>

      <div class="header-right">
        <!-- Bouton Langue -->
        <button class="header-btn lang-btn" type="button" title="Changer de langue">
          <svg class="globe" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>

        <!-- Notifications -->
        <button class="header-btn notif-btn" type="button" title="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="notif-badge">3</span>
        </button>

        <!-- Thème -->
        <button class="header-btn theme-btn" type="button" title="Mode sombre">
          <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
